---
schema_version: 1
verified_on: "2026-07-18"
exceptions:
  - url: https://export.arxiv.org/api/query
    lychee_pattern: '^https://export\.arxiv\.org/api/query$'
    reason: >-
      Machine API endpoint used by the crawler; it requires a query string and
      is exercised by deterministic mocked tests instead of a bare GET.
  - url: http://www.w3.org/2005/Atom
    lychee_pattern: '^http://www\.w3\.org/2005/Atom$'
    reason: >-
      XML namespace identifier, not a promise that the identifier dereferences
      as a normal web page.
  - url: https://www.mathworks.com/products/radar.html
    lychee_pattern: '^https://www\.mathworks\.com/products/radar\.html$'
    reason: >-
      Vendor WAF returns 403 to automated Lychee requests while an independent
      browser-like request returned HTTP 200 on the verification date.
  - url: https://doi.org/10.1002/0471663085
    lychee_pattern: '^https://doi\.org/10\.1002/0471663085$'
    reason: >-
      The canonical DOI resolves correctly, but its Wiley landing page returns
      HTTP 403 to Lychee. The same record's exact Crossref API URL remains in
      the authority snapshot and is checked by the live-link gate.
